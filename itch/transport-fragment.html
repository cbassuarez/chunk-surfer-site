<!-- Append this once as the LAST child of each .custom-contact-skip-bank.
     Keep the real links and their semantic labels in the existing state banks.
     These two persistent, noninteractive skins finish their release animation
     while a different destination link becomes active above them. -->
<div class="custom-contact-skin" aria-hidden="true">
  <span class="custom-cap custom-field-key custom-transport-face custom-transport-face-prev">
    <span class="custom-key-legend">‹ PREV</span>
    <span class="custom-key-lamp"><span class="custom-key-lamp-paint"></span></span>
    <span class="custom-key-lens"></span>
    <span class="custom-key-socket"></span>
  </span>
  <span class="custom-cap custom-field-key custom-transport-face custom-transport-face-next">
    <span class="custom-key-legend">NEXT ›</span>
    <span class="custom-key-lamp"><span class="custom-key-lamp-paint"></span></span>
    <span class="custom-key-lens"></span>
    <span class="custom-key-socket"></span>
  </span>
</div>
